<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
<title>llamalite</title>
<style>
  :root{ --bg:#0e1014; --panel:#161a21; --panel2:#1e2330; --acc:#4f8cff; --txt:#e8ecf4; --mut:#8b93a7; --ok:#37c76b; --err:#ff5d5d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--txt);
    font:15px/1.45 -apple-system,Roboto,"Segoe UI",system-ui,sans-serif; }
  .wrap{ display:flex; flex-direction:column; height:100dvh; max-width:900px; margin:0 auto; }
  header{ display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--panel);
    border-bottom:1px solid #262b36; position:sticky; top:0; z-index:5; flex-wrap:wrap; }
  .ttl{ font-weight:800; letter-spacing:.4px; }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--err); }
  .dot.on{ background:var(--ok); }
  select,input,textarea{ background:var(--panel2); color:var(--txt); border:1px solid #2c3243;
    border-radius:9px; padding:7px 9px; font:inherit; }
  select{ max-width:38vw; }
  .spacer{ flex:1; }
  button{ background:var(--acc); color:#fff; border:0; border-radius:9px; padding:8px 13px;
    font:inherit; font-weight:600; cursor:pointer; }
  button.ghost{ background:var(--panel2); border:1px solid #2c3243; color:var(--txt); }
  button.sm{ padding:5px 9px; font-size:.85em; }
  button.danger{ background:#5a2330; color:#ffd7de; border:1px solid #7a2f3d; }
  button:disabled{ opacity:.5; }
  .tabs{ display:flex; gap:6px; padding:8px 12px 0; background:var(--bg); overflow-x:auto; }
  .tabs button{ background:transparent; color:var(--mut); border:0; border-bottom:2px solid transparent; border-radius:0; white-space:nowrap; }
  .tabs button.act{ color:var(--txt); border-bottom-color:var(--acc); }
  #chat{ flex:1; overflow-y:auto; padding:14px 12px 4px; }
  .msg{ max-width:92%; padding:10px 13px; border-radius:14px; margin:7px 0; white-space:pre-wrap; word-wrap:break-word; }
  .u{ background:var(--acc); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .a{ background:var(--panel2); border-bottom-left-radius:4px; }
  .msg .att{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 2px; }
  .msg .att img{ max-width:120px; max-height:120px; border-radius:8px; border:1px solid #ffffff33; }
  .meta{ color:var(--mut); font-size:.78em; margin:2px 4px 0; }
  .think{ color:var(--mut); font-size:.9em; border-left:2px solid #3a4257; padding-left:8px; margin:0 0 8px; white-space:pre-wrap; }
  .row{ display:flex; gap:8px; padding:10px 12px; background:var(--panel); border-top:1px solid #262b36; align-items:flex-end; }
  .row textarea{ flex:1; resize:none; min-height:44px; max-height:140px; background:var(--panel2); border-radius:11px; }
  .bar{ display:flex; align-items:center; gap:10px; padding:7px 12px; flex-wrap:wrap; background:var(--panel); border-bottom:1px solid #202531; }
  .bar label{ color:var(--mut); font-size:.82em; display:flex; gap:5px; align-items:center; }
  #chips{ display:flex; flex-wrap:wrap; gap:6px; padding:0 12px; }
  #chips:not(:empty){ padding:8px 12px 2px; }
  .chip{ display:flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid #2c3243;
    border-radius:10px; padding:4px 7px; font-size:.82em; max-width:230px; }
  .chip img{ width:40px; height:40px; object-fit:cover; border-radius:6px; }
  .chip .x{ cursor:pointer; color:var(--mut); font-weight:700; }
  #settings{ display:none; flex:1; overflow-y:auto; padding:12px; }
  details.cat{ border:1px solid #2a3040; border-radius:12px; margin:0 0 10px; padding:0 12px; }
  details.cat>summary{ cursor:pointer; padding:11px 0; font-weight:600; color:#cfd6e6; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; padding-bottom:12px; }
  .f{ display:flex; flex-direction:column; gap:4px; }
  .f label{ color:var(--mut); font-size:.78em; }
  .f input,.f select{ width:100%; }
  .f .help{ color:#5f6878; font-size:.7em; }
  .chk{ display:flex; flex-direction:row; align-items:center; gap:8px; color:var(--txt); }
  .chk input{ width:auto; }
  .full{ grid-column:1/-1; }
  .hint{ color:var(--mut); font-size:.8em; }
  .toast{ position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:#2a2f3d;
    border:1px solid #3a4257; padding:9px 14px; border-radius:10px; font-size:.9em; opacity:0;
    transition:.2s; pointer-events:none; z-index:9; max-width:90vw; }
  .toast.show{ opacity:1; }
  pre.log{ background:#0b0d11; border:1px solid #262b36; border-radius:8px; padding:8px; font-size:12px;
    max-height:320px; overflow:auto; color:#b7c0d0; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="dot" id="dot"></span>
    <span class="ttl">llamalite</span>
    <select id="model" title="Model"></select>
    <button class="ghost" id="btnStart">▶ Start</button>
    <button class="ghost" id="btnStopSrv">■ Stop</button>
    <span class="spacer"></span>
    <button class="ghost sm" id="btnScan">⟳</button>
  </header>

  <div class="tabs">
    <button id="tabChat" class="act">Chat</button>
    <button id="tabSet">Nastavenia</button>
    <button id="tabLog">Log</button>
  </div>

  <!-- CHAT -->
  <div id="viewChat" style="display:flex; flex-direction:column; flex:1; min-height:0;">
    <div class="bar">
      <label>stream <input type="checkbox" id="stream" checked></label>
      <span id="servinfo" class="hint"></span>
      <span class="spacer"></span>
      <span id="mem" class="hint"></span>
    </div>
    <div id="chat"></div>
    <div id="chips"></div>
    <div class="row">
      <button class="ghost" id="btnAttach" title="Pripojiť obrázok / audio / video">📎</button>
      <input type="file" id="file" multiple accept="image/*,audio/*,video/*,.wav,.mp3,.ogg,.opus,.m4a,.mp4,.mkv,.mov,.webm" style="display:none">
      <textarea id="inp" placeholder="Napíš správu… (Enter = odoslať, 📎 = priložiť)"></textarea>
      <button id="btnStopGen" class="danger" style="display:none">■ Stop</button>
      <button id="btnSend">Poslať</button>
    </div>
  </div>

  <!-- NASTAVENIA -->
  <div id="settings">
    <p class="hint" id="setHint">Načítavam…</p>
    <div id="setForm"></div>

    <details class="cat"><summary>Chat (len pre túto appku)</summary>
      <div class="grid">
        <div class="f"><label>max_tokens</label><input id="c_maxtok" type="number" min="16" step="256"></div>
        <div class="f"><label>snímok z videa</label><input id="c_vframes" type="number" min="1" max="16"></div>
        <div class="f"><label class="chk"><input type="checkbox" id="c_vaudio"> audio z videa</label></div>
      </div>
    </details>

    <details class="cat"><summary>Model / mmproj / extra</summary>
      <div class="grid">
        <div class="f full"><label>Vybraný model</label><div id="selModelName" class="hint">—</div></div>
        <div class="f"><label>mmproj</label>
          <select id="s_mmproj"><option value="auto">auto</option><option value="off">off (bez vision)</option></select></div>
        <div class="f full"><label>alias</label><input id="s_alias"></div>
        <div class="f full"><label>extra_args (voľný text, rozdelí sa ako shell)</label><input id="s_extra" placeholder="napr. --swa-full --no-context-shift"></div>
      </div>
    </details>

    <details class="cat"><summary>Pokročilé (celý settings.json)</summary>
      <div class="grid"><div class="f full"><textarea id="s_raw" rows="12" spellcheck="false"></textarea></div></div>
      <div style="display:flex; gap:8px; padding-bottom:12px;">
        <button id="btnRawReload" class="ghost">Načítať JSON</button>
        <button id="btnRawSave">Uložiť RAW</button>
      </div>
    </details>

    <div style="display:flex; gap:8px; position:sticky; bottom:0; padding:12px 0; background:var(--bg);">
      <button id="btnSave">💾 Uložiť</button>
      <button id="btnSaveStart" class="ghost">Uložiť &amp; reštart</button>
    </div>
  </div>

  <!-- LOG -->
  <div id="viewLog" style="display:none; flex:1; overflow-y:auto; padding:12px;">
    <button class="ghost sm" id="btnReloadLog">⟳ Obnoviť</button>
    <pre class="log" id="logbox" style="margin-top:8px;">(načítavam…)</pre>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const BASE = location.origin;
const LLAMA = localStorage.getItem("ll_base") || "http://127.0.0.1:8080";
let cfg=null, scan=[], modelList=[], history=[], attach=[], flagsSpec=null;
let abortCtl=null;

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2500); }
function dot(on){ $("#dot").classList.toggle("on", !!on); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"""}[c])); }

function tab(name){
  for(const n of ["Chat","Set","Log"]) $("#tab"+n).classList.toggle("act", n===name);
  $("#viewChat").style.display = name==="Chat"?"flex":"none";
  $("#settings").style.display = name==="Set"?"block":"none";
  $("#viewLog").style.display = name==="Log"?"block":"none";
  if(name==="Log") loadLog();
}
$("#tabChat").onclick=()=>tab("Chat"); $("#tabSet").onclick=()=>tab("Set"); $("#tabLog").onclick=()=>tab("Log");

// ---------- SCAN ----------
async function doScan(){
  try{
    const r=await fetch(BASE+"/api/scan",{cache:"no-store"}); const j=await r.json();
    scan=j.profiles||[]; const sel=$("#model"); const prev=sel.value; sel.innerHTML="";
    scan.forEach(p=>{ const o=document.createElement("option"); o.value=p.id;
      const sz=(p.size_mb>=1024?(p.size_mb/1024).toFixed(1)+"G":Math.round(p.size_mb)+"M");
      o.textContent=p.name.slice(0,32)+" · "+sz+(p.broken?" ⚠":"")+(p.vision?" 👁":"");
      o.title=p.path+(p.mmproj?("\nmmproj: "+p.mmproj_name):""); sel.appendChild(o); });
    if(prev && scan.some(p=>p.id===prev)) sel.value=prev; else if(scan.length) sel.value=scan[0].id;
    showSel();
  }catch(e){ toast("Sken zlyhal: "+e.message); }
}
function showSel(){ const b=scan.find(p=>p.id===$("#model").value);
  $("#selModelName").textContent=b?(b.path+(b.vision?("\nmmproj: "+b.mmproj_name):"")+(b.broken?"   ⚠ POŠKODENÝ":"")):"—"; }
$("#btnScan").onclick=doScan; $("#model").onchange=showSel;

async function refreshServer(){
  try{ const r=await fetch(LLAMA+"/v1/models",{cache:"no-store"}); if(!r.ok) throw 0;
    const j=await r.json(); modelList=(j.data||[]).map(m=>m.id);
    $("#servinfo").textContent="server OK · "+(modelList.join(", ")||"?"); dot(true);
  }catch(e){ $("#servinfo").textContent="server nebeží"; dot(false); }
}
async function refreshMem(){ try{ const r=await fetch(BASE+"/api/status",{cache:"no-store"}); const j=await r.json();
  const m=j.mem||{}; $("#mem").textContent="RAM "+m.free_mb+"M / "+m.total_mb+"M"; }catch(e){} }

// ---------- START/STOP ----------
async function startModel(){
  const id=$("#model").value; if(!id){ toast("Vyber model"); return; }
  const b=scan.find(p=>p.id===id);
  if(b && b.broken && !confirm("Model má poškodenú GGUF hlavičku.\nPokračovať?")) return;
  $("#btnStart").disabled=true; toast("Štartujem "+id+"…");
  try{ const r=await fetch(BASE+"/api/start?id="+encodeURIComponent(id),{cache:"no-store"});
    const j=await r.json();
    if(j.status==="ok"){ toast("Beží ✔"); setTimeout(refreshServer,400); }
    else{ toast("Chyba: "+((j.output||"").split("\n").pop()||"")); tab("Log"); }
  }catch(e){ toast("Chyba: "+e.message); } finally{ $("#btnStart").disabled=false; refreshMem(); }
}
async function stopModel(){
  try{ const r=await fetch(BASE+"/api/stop",{cache:"no-store"}); const j=await r.json();
    toast("Zastavené ("+(j.killed||0)+")"); modelList=[]; refreshServer(); refreshMem(); }catch(e){ toast("Chyba: "+e.message); }
}
$("#btnStart").onclick=startModel; $("#btnStopSrv").onclick=stopModel;

// ---------- PRÍLOHY ----------
$("#btnAttach").onclick=()=>$("#file").click();
$("#file").onchange = async (e)=>{ const files=[...e.target.files]; e.target.value=""; for(const f of files){ await uploadOne(f);} };
function fileToDataURL(f){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); }); }
async function getB64(path){ const r=await fetch(BASE+"/api/file?path="+encodeURIComponent(path)); const b=await r.blob();
  return await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result.split(",")[1]); fr.onerror=rej; fr.readAsDataURL(b); }); }
async function uploadOne(f){
  toast("Nahrávam "+f.name+"…");
  let j;
  try{ const r=await fetch(BASE+"/upload",{method:"POST",headers:{"X-Filename":encodeURIComponent(f.name)},body:f}); j=await r.json(); }
  catch(err){ toast("Upload zlyhal: "+err.message); return; }
  if(j.status!=="ok"){ toast("Upload: "+(j.error||"?")); return; }
  if(j.kind==="image"){ attach.push({kind:"image", name:j.name, path:j.path, dataurl:await fileToDataURL(f)}); }
  else if(j.kind==="audio"){ attach.push({kind:"audio", name:j.name, path:j.converted||j.path}); }
  else if(j.kind==="video"){
    (j.frames||[]).forEach(fr=>attach.push({kind:"image", name:fr.name, path:fr.path, dataurl:null}));
    if(j.audio) attach.push({kind:"audio", name:(j.name+" (audio)"), path:j.audio});
    if((!j.frames||!j.frames.length)&&!j.audio) toast("Z videa nič"+(j.convert_error?(" ("+j.convert_error+")"):""));
  } else toast("Nepodporovaný typ: "+f.name);
  renderChips();
}
function renderChips(){
  const c=$("#chips"); c.innerHTML="";
  attach.forEach((a,i)=>{
    const d=document.createElement("div"); d.className="chip"; let inner="";
    if(a.kind==="image"){ const src=a.dataurl||(BASE+"/api/file?path="+encodeURIComponent(a.path)); inner='<img src="'+src+'">'; }
    else if(a.kind==="audio"){ inner='<span>🔊</span>'; }
    inner+='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px">'+esc(a.name)+'</span>';
    d.innerHTML=inner+'<span class="x">✕</span>';
    d.querySelector(".x").onclick=()=>{ attach.splice(i,1); renderChips(); };
    c.appendChild(d);
  });
}

// ---------- CHAT ----------
function bubble(role, text, atts){
  const d=document.createElement("div"); d.className="msg "+(role==="user"?"u":"a");
  if(text) d.appendChild(document.createTextNode(text));
  if(atts && atts.length){ const box=document.createElement("div"); box.className="att";
    atts.filter(a=>a.kind==="image").forEach(a=>{ const img=document.createElement("img");
      img.src=a.dataurl||(BASE+"/api/file?path="+encodeURIComponent(a.path)); box.appendChild(img); });
    atts.filter(a=>a.kind==="audio").forEach(a=>{ const s=document.createElement("span"); s.textContent="🔊 "+a.name; box.appendChild(s); });
    d.appendChild(box); }
  $("#chat").appendChild(d); $("#chat").scrollTop=$("#chat").scrollHeight; return d;
}
async function send(){
  const text=$("#inp").value.trim();
  if(!text && !attach.length) return;
  if(!modelList.length){ await refreshServer(); if(!modelList.length){ toast("Server nebeží – klikni Start"); return; } }
  const content=[];
  if(text) content.push({type:"text", text});
  for(const a of attach){
    if(a.kind==="image"){ if(a.dataurl) content.push({type:"image_url", image_url:{url:a.dataurl}});
      else { try{ const b64=await getB64(a.path); content.push({type:"image_url", image_url:{url:"data:image/jpeg;base64,"+b64}}); }catch(e){} } }
    else if(a.kind==="audio"){ try{ const b64=await getB64(a.path); content.push({type:"input_audio", input_audio:{data:b64, format:"wav"}}); }catch(e){} }
  }
  bubble("user", text, attach); history.push({role:"user", content:content});
  attach=[]; renderChips(); $("#inp").value=""; $("#inp").style.height="auto";
  const d=(cfg&&cfg.defaults)||{};
  const body={ model:modelList[0], messages:history,
    max_tokens:(cfg&&cfg.chat&&cfg.chat.max_tokens)||2048,
    temperature:(d.temp!=null?d.temp:0.8), top_p:(d["top-p"]!=null?d["top-p"]:0.95),
    stream:$("#stream").checked };
  abortCtl=new AbortController();
  $("#btnSend").disabled=true; $("#btnStopGen").style.display="inline-block";
  const a=bubble("assistant",""); let content2="",think="",nt=0; const t0=performance.now();
  try{
    const r=await fetch(BASE+"/proxy",{method:"POST",
      headers:{"Content-Type":"application/json","X-Target":LLAMA+"/v1/chat/completions"},
      body:JSON.stringify(body), signal:abortCtl.signal});
    if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,200));
    if(body.stream && r.body){
      const rd=r.body.getReader(), dec=new TextDecoder(); let buf="";
      while(true){ const {done,value}=await rd.read(); if(done)break;
        buf+=dec.decode(value,{stream:true}); const lines=buf.split("\n"); buf=lines.pop();
        for(const ln of lines){ const s=ln.trim(); if(!s.startsWith("data:"))continue;
          const data=s.slice(5).trim(); if(data==="[DONE]")continue; let j; try{j=JSON.parse(data);}catch{continue;}
          const dd=(j.choices&&j.choices[0]&&j.choices[0].delta)||{};
          if(dd.reasoning_content) think+=dd.reasoning_content;
          if(dd.content){ content2+=dd.content; nt++; }
          a.innerHTML=(think? '<div class="think">💭 '+esc(think)+'</div>':"")+esc(content2);
          $("#chat").scrollTop=$("#chat").scrollHeight; } }
    }else{ const j=await r.json(); const m=(j.choices&&j.choices[0]&&j.choices[0].message)||{};
      think=m.reasoning_content||""; content2=m.content||"";
      a.innerHTML=(think? '<div class="think">💭 '+esc(think)+'</div>':"")+esc(content2); }
    history.push({role:"assistant", content:content2});
    const dt=(performance.now()-t0)/1000; const m=document.createElement("div"); m.className="meta";
    m.textContent="⏱ "+dt.toFixed(1)+" s · "+(nt?(nt/dt).toFixed(1)+" tok/s":"")+(think?" · myslel":""); a.after(m);
  }catch(e){
    if(e.name==="AbortError"){ a.textContent=(content2||"")+"\n\n■ zastavené"; if(content2) history.push({role:"assistant", content:content2}); }
    else a.textContent="⚠ Chyba: "+e.message;
  }finally{ abortCtl=null; $("#btnSend").disabled=false; $("#btnStopGen").style.display="none"; refreshMem(); }
}
$("#btnSend").onclick=send; $("#btnStopGen").onclick=()=>{ if(abortCtl) abortCtl.abort(); };
$("#inp").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();} });
$("#inp").addEventListener("input",()=>{ const i=$("#inp"); i.style.height="auto"; i.style.height=Math.min(i.scrollHeight,140)+"px"; });

// ---------- NASTAVENIA (generované z flags.json) ----------
function fieldHtml(f){
  const id="f_"+f.key.replace(/[^a-z0-9]/gi,"_");
  const lbl=esc(f.label||f.key);
  const help=f.help?('<span class="help">'+esc(f.help)+'</span>'):"";
  let input="";
  if(f.type==="boolneg"){
    return '<div class="f"><label class="chk"><input type="checkbox" data-bool="1" id="'+id+'" data-key="'+esc(f.key)+'"> '+lbl+'</label>'+help+'</div>';
  }else if(f.type==="bool"){
    return '<div class="f"><label class="chk"><input type="checkbox" id="'+id+'" data-key="'+esc(f.key)+'"> '+lbl+'</label>'+help+'</div>';
  }else if(f.type==="select"){
    input='<select id="'+id+'" data-key="'+esc(f.key)+'">';
    (f.options||[]).forEach(o=>{ input+='<option value="'+esc(o)+'">'+(o===""?"(default)":esc(o))+'</option>'; });
    input+='</select>';
  }else if(f.type==="int"){
    input='<input type="number" step="1" id="'+id+'" data-key="'+esc(f.key)+'">';
  }else if(f.type==="float"){
    input='<input type="number" step="0.05" id="'+id+'" data-key="'+esc(f.key)+'">';
  }else{
    input='<input type="text" id="'+id+'" data-key="'+esc(f.key)+'">';
  }
  return '<div class="f"><label>'+lbl+'</label>'+input+help+'</div>';
}
function buildForm(){
  const box=$("#setForm"); box.innerHTML="";
  (flagsSpec.categories||[]).forEach(cat=>{
    const d=document.createElement("details"); d.className="cat";
    let h='<summary>'+esc(cat.title)+'</summary><div class="grid">';
    (cat.fields||[]).forEach(f=>{ h+=fieldHtml(f); });
    h+='</div>'; d.innerHTML=h; box.appendChild(d);
  });
}
function applyCfgToForm(){
  const d=cfg.defaults||{}, c=cfg.chat||{};
  // najdi spec pre dane key
  const byKey={}; (flagsSpec.categories||[]).forEach(cat=>(cat.fields||[]).forEach(f=>byKey[f.key]=f));
  document.querySelectorAll("#setForm [data-key]").forEach(el=>{
    const key=el.getAttribute("data-key"); const f=byKey[key]||{}; const v=d[key];
    if(el.type==="checkbox"){
      if(f.type==="boolneg") el.checked = (v!==false && v!==undefined && v!==null && v!==""); // default on
      else el.checked = !!v;
    }else{
      el.value = (v===undefined||v===null)?"":v;
    }
  });
  $("#s_mmproj").value = (d.mmproj==="off")?"off":"auto";
  $("#s_alias").value = d.alias||"";
  $("#s_extra").value = d.extra_args||"";
  $("#c_maxtok").value = c.max_tokens||2048;
  $("#c_vframes").value = c.video_frames||6;
  $("#c_vaudio").checked = c.video_audio!==false;
  $("#s_raw").value = JSON.stringify(cfg,null,2);
}
function formToCfg(){
  const d=cfg.defaults||{};
  const byKey={}; (flagsSpec.categories||[]).forEach(cat=>(cat.fields||[]).forEach(f=>byKey[f.key]=f));
  document.querySelectorAll("#setForm [data-key]").forEach(el=>{
    const key=el.getAttribute("data-key"); const f=byKey[key]||{};
    if(el.type==="checkbox"){
      if(f.type==="boolneg") d[key] = el.checked; else d[key] = el.checked ? true : false;
      if(f.type==="bool" && !el.checked) delete d[key];
    }else{
      const v=el.value;
      if(v==="" ) { delete d[key]; }
      else if(f.type==="int") d[key]=parseInt(v,10);
      else if(f.type==="float") d[key]=parseFloat(v);
      else d[key]=v;
    }
  });
  d.mmproj = $("#s_mmproj").value;
  d.alias = $("#s_alias").value;
  d.extra_args = $("#s_extra").value;
  cfg.defaults=d;
  cfg.chat={max_tokens:parseInt($("#c_maxtok").value||"2048",10), video_frames:parseInt($("#c_vframes").value||"6",10), video_audio:$("#c_vaudio").checked};
}
async function loadCfg(){
  try{ const r=await fetch(BASE+"/api/settings",{cache:"no-store"}); cfg=await r.json(); applyCfgToForm(); }
  catch(e){ toast("Nepodarilo sa načítať nastavenia"); }
}
async function saveCfgObj(obj){
  try{ const r=await fetch(BASE+"/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
    const j=await r.json(); if(j.status!=="ok") throw new Error(j.error||"?"); toast("Uložené ✔"); return true;
  }catch(e){ toast("Chyba uloženia: "+e.message); return false; }
}
$("#btnSave").onclick=async()=>{ formToCfg(); if(await saveCfgObj(cfg)) applyCfgToForm(); };
$("#btnSaveStart").onclick=async()=>{ formToCfg(); if(await saveCfgObj(cfg)){ applyCfgToForm(); startModel(); } };
$("#btnRawReload").onclick=loadCfg;
$("#btnRawSave").onclick=async()=>{ let o; try{ o=JSON.parse($("#s_raw").value); }catch(e){ toast("Neplatný JSON: "+e.message); return; }
  if(await saveCfgObj(o)){ cfg=o; applyCfgToForm(); } };

async function loadLog(){ try{ const r=await fetch(BASE+"/api/log",{cache:"no-store"}); const j=await r.json();
  $("#logbox").textContent=j.log||"(prázdny)"; $("#logbox").scrollTop=$("#logbox").scrollHeight; }catch(e){ $("#logbox").textContent="chyba: "+e.message; } }
$("#btnReloadLog").onclick=loadLog;

(async ()=>{
  try{ const r=await fetch(BASE+"/flags.json",{cache:"no-store"}); flagsSpec=await r.json(); }
  catch(e){ flagsSpec={categories:[]}; toast("flags.json sa nenačítal"); }
  buildForm();
  await loadCfg();
  await doScan();
  await refreshServer(); refreshMem();
  $("#setHint").textContent="Všetky reálne prepínače llama-servera ("+((flagsSpec.categories||[]).reduce((a,c)=>a+(c.fields||[]).length,0))+" položiek). Nevyplnené = vynechané (default llama-servera).";
  setInterval(refreshServer,8000); setInterval(refreshMem,5000);
  setInterval(()=>{ if($("#viewLog").style.display!=="none") loadLog(); },4000);
})();
</script>
</body>
