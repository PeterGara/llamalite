name: build-llamalite-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Sign APK (debug keystore = installable)
        run: |
          BT=$(ls $ANDROID_SDK_ROOT/build-tools/ | sort -V | tail -1)
          KS="$RUNNER_TEMP/ks.jks"
          keytool -genkeypair -keystore "$KS" -alias ll -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass llpass123 -keypass llpass123 \
            -dname "CN=llamalite" >/dev/null 2>&1
          ALIGNED="$RUNNER_TEMP/aligned.apk"
          $ANDROID_SDK_ROOT/build-tools/$BT/zipalign -f 4 "${{ steps.apk.outputs.path }}" "$ALIGNED"
          $ANDROID_SDK_ROOT/build-tools/$BT/apksigner sign \
            --ks "$KS" --ks-key-alias ll \
            --ks-pass pass:llpass123 --key-pass pass:llpass123 \
            --out llamalite.apk "$ALIGNED"
          $ANDROID_SDK_ROOT/build-tools/$BT/apksigner verify -v llamalite.apk | head -3
          ls -lh llamalite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: llamalite-apk
          path: llamalite.apk
          if-no-files-found: error